[project]
name = "microsoft-decision-mcp"
version = "0.1.0"
description = "Local MCP server that evaluates state against yes/no, choice, and score questions with a Microsoft-Decision-1 deployment in Microsoft Foundry."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.16",
    "keyring>=25.7",
    "mcp>=2.3",
    "pydantic>=2.12",
    "python-dotenv>=1.2",
]

[project.scripts]
microsoft-decision-mcp = "microsoft_decision_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
