name: Validate and build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate, test, and package ${{ matrix.solution }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        solution:
          - JevCustomConnector
          - MicrosoftDecisionCustomConnector

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node tooling
        run: npm ci --no-audit --no-fund

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true

      - name: Validate solution source
        shell: pwsh
        run: ./scripts/Validate-Solution.ps1 -Solution '${{ matrix.solution }}' -SkipPack

      - name: Determine build version
        id: version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content './solutions/${{ matrix.solution }}/src/Other/Solution.xml' -Raw
          $sourceVersion = [version]$manifest.ImportExportXml.SolutionManifest.Version
          $buildVersion = "{0}.{1}.{2}.{3}" -f $sourceVersion.Major, $sourceVersion.Minor, ($sourceVersion.Build + [int]$env:GITHUB_RUN_NUMBER), $env:GITHUB_RUN_ATTEMPT
          "value=$buildVersion" >> $env:GITHUB_OUTPUT
          "Packaging solution version $buildVersion"

      - name: Build managed and unmanaged packages
        shell: pwsh
        run: ./scripts/Build-Solution.ps1 -Solution '${{ matrix.solution }}' -PackageType Both -Version '${{ steps.version.outputs.value }}'

      - name: Upload solution packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.solution }}-${{ steps.version.outputs.value }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Prepare versioned managed solution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item './artifacts/${{ matrix.solution }}_managed.zip' './release/${{ matrix.solution }}_${{ steps.version.outputs.value }}_managed.zip'

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.solution }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  # Single stable check for the "Protect main" ruleset, independent of the matrix entries.
  validate:
    name: Validate, test, and package
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every solution build to succeed
        run: test "${{ needs.build.result }}" = success

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download versioned managed solutions
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      # One release per build carries every connector's managed solution, so the latest release
      # always offers the current version of each.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="release-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Connectors build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --generate-notes
